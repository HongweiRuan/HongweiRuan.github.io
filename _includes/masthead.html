<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav class="site-nav" aria-label="Sections">
        <ul class="site-nav__links">
          <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item"><a href="#about-me">Homepage</a></li>
          {% for link in site.data.navigation.main %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
          {% endfor %}
        </ul>
      </nav>
      <!-- Empty stub for the template's priority-nav script (main.min.js updateNav),
           which recurses forever if #site-nav is missing. -->
      <nav id="site-nav" hidden aria-hidden="true" style="display:none"><button class="hidden" tabindex="-1"></button><ul class="visible-links"></ul><ul class="hidden-links hidden"></ul></nav>
    </div>
  </div>
</div>
